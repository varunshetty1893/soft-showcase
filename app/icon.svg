<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Brand deep ocean teal -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08252B" />
      <stop offset="35%" stop-color="#114750" />
      <stop offset="70%" stop-color="#155761" />
      <stop offset="100%" stop-color="#1E7583" />
    </linearGradient>

    <!-- Connected SS Monogram Gradient: Mint to Crisp White to Emerald -->
    <linearGradient id="ssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="25%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#99F6E4" />
    </linearGradient>

    <!-- Ligature Connection Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#5EEAD4" />
    </linearGradient>

    <!-- Premium Glow / Shadow Filter -->
    <filter id="monogramShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#2DD4BF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4" />

  <!-- Subtle ambient inner aura -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="rgba(45, 212, 191, 0.08)" stroke-width="24" />

  <!-- Connected "SS" Monogram -->
  <g filter="url(#monogramShadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- First S (Left) -->
    <path d="M 226 176 C 226 138, 144 138, 144 195 C 144 248, 228 252, 228 315 C 228 372, 144 372, 144 330" 
          stroke="url(#ssGrad)" stroke-width="44" />

    <!-- Connecting Ligature Bridge linking the two S letterforms -->
    <!-- Elegantly bridges the lower curve of S1 to the upper curve of S2 -->
    <path d="M 224 315 C 246 315, 266 195, 288 195" 
          stroke="url(#bridgeGrad)" stroke-width="38" />

    <!-- Central Ligature Crossbar uniting both S at their core waist -->
    <path d="M 188 254 L 324 254" 
          stroke="url(#bridgeGrad)" stroke-width="40" />

    <!-- Second S (Right) -->
    <path d="M 370 176 C 370 138, 288 138, 288 195 C 288 248, 372 252, 372 315 C 372 372, 288 372, 288 330" 
          stroke="url(#ssGrad)" stroke-width="44" />
  </g>
</svg>